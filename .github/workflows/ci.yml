name: CI

on:
  push:
    branches:
      - main
  pull_request:
  # Allow manually triggering the workflow.
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']

    name: "PHPUnit (PHP ${{ matrix.php }})"
    continue-on-error: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PHP with latest composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Install dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-composer-dependencies
      - name: "Install Composer dependencies"
        uses: "ramsey/composer-install@v4"

      - name: Run unit tests
        run: vendor/bin/phpunit


  code-quality:
    name: Check ${{ matrix.tool }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            tool: 'phpstan'
          - php: '8.4'
            tool: 'phpmd'
          - php: '8.4'
            tool: 'code-coverage'
          - php: '8.3'
            tool: 'code-style'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2 #https://github.com/shivammathur/setup-php
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit
          extensions: mbstring
          coverage: xdebug

      # Install dependencies and handle caching in one go.
      # @link https://github.com/marketplace/actions/install-composer-dependencies
      - name: "Install Composer dependencies"
        uses: "ramsey/composer-install@v4"

      - name: Run static code analysis
        if: ${{ matrix.tool == 'phpstan' }}
        run: composer run phpstan -- --error-format=github

      - name: Run PHPMD
        if: ${{ matrix.tool == 'phpmd' }}
        run: composer run phpmd -- --format=github

      - name: Run tests with coverage and enforce 100%
        if: ${{ matrix.tool == 'code-coverage' }}
        run: composer run coverage-check

      - name: Upload coverage reports to Codecov
        if: ${{ matrix.tool == 'code-coverage' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.xml
          fail_ci_if_error: true
          verbose: true

      - name: Check code-style
        if: ${{ matrix.tool == 'code-style' }}
        run: composer run codestyle -- --dry-run --diff


  bc-check:
    name: Backward compatibility (Roave)
    runs-on: ubuntu-latest

    steps:
      # The tool compares against the newest release tag, so the tags must be fetched.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The runner sets HOME=/github/home, which hides the image's own safe.directory
      # setting; without it git refuses the workspace checked out by another user.
      - name: Check backward compatibility against the last release
        uses: docker://nyholm/roave-bc-check-ga
        env:
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: --format=github-actions
